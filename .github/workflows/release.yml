name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          bash Scripts/release-preflight.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - run: make verify

  homebrew:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Require distribution credentials
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD DEVELOPER_ID_APPLICATION ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TAP_TOKEN TAP_REPOSITORY; do
            test -n "${!name}" || { echo "Missing secret: $name" >&2; exit 1; }
          done
      - name: Import signing identities
        run: |
          keychain="$RUNNER_TEMP/huri.keychain-db"
          certificate="$RUNNER_TEMP/huri.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p runner "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p runner "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$keychain"
      - name: Build Developer ID distribution
        run: |
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" BUILD_ARCHS="arm64 x86_64" DISTRIBUTION=homebrew SIGNING_IDENTITY="$DEVELOPER_ID_APPLICATION" make package
          REQUIRED_ARCHS="arm64 x86_64" bash Scripts/verify-app.sh
          DMG_SIGNING_IDENTITY="$DEVELOPER_ID_APPLICATION" bash Scripts/create-dmg.sh
      - name: Notarize and staple
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key"
          ASC_KEY_PATH="$key" bash Scripts/notarize-dmg.sh dist/Huri.dmg
      - name: Publish GitHub release
        run: |
          shasum -a 256 dist/Huri.dmg | tee dist/Huri.dmg.sha256
          gh release create "$TAG" dist/Huri.dmg dist/Huri.dmg.sha256 --verify-tag --generate-notes --title "Huri $VERSION"
      - name: Update Homebrew tap
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/Huri.dmg"
          sha="$(shasum -a 256 dist/Huri.dmg | awk '{print $1}')"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$TAP_REPOSITORY.git" "$RUNNER_TEMP/tap"
          bash Scripts/update-cask.sh "$VERSION" "$url" "$sha" "$RUNNER_TEMP/tap/Casks/huri.rb"
          git -C "$RUNNER_TEMP/tap" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/tap" add Casks/huri.rb
          git -C "$RUNNER_TEMP/tap" commit -m "huri $VERSION"
          git -C "$RUNNER_TEMP/tap" push

  app-store:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APP_STORE_APPLICATION_IDENTITY: ${{ secrets.APP_STORE_APPLICATION_IDENTITY }}
      APP_STORE_INSTALLER_IDENTITY: ${{ secrets.APP_STORE_INSTALLER_IDENTITY }}
      APP_STORE_PROVISIONING_PROFILE: ${{ secrets.APP_STORE_PROVISIONING_PROFILE }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Require App Store credentials
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APP_STORE_APPLICATION_IDENTITY APP_STORE_INSTALLER_IDENTITY APP_STORE_PROVISIONING_PROFILE ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing secret: $name" >&2; exit 1; }
          done
      - name: Import signing identities
        run: |
          keychain="$RUNNER_TEMP/huri.keychain-db"
          certificate="$RUNNER_TEMP/huri.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p runner "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p runner "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$keychain"
      - name: Build signed App Store package
        run: |
          profile="$RUNNER_TEMP/Huri.provisionprofile"
          echo "$APP_STORE_PROVISIONING_PROFILE" | base64 --decode > "$profile"
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" BUILD_ARCHS="arm64 x86_64" PROVISIONING_PROFILE_PATH="$profile" make app-store
          REQUIRED_ARCHS="arm64 x86_64" bash Scripts/verify-app.sh
      - name: Upload to App Store Connect
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$key" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --validate-app -f dist/Huri-AppStore.pkg -t macos --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f dist/Huri-AppStore.pkg -t macos --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Huri-AppStore-${{ needs.validate.outputs.version }}
          path: dist/Huri-AppStore.pkg
          if-no-files-found: error
          retention-days: 30
