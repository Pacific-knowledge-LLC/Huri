name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Swift quality and distributable
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve pinned dependencies
        run: |
          swift package resolve
          git diff --exit-code Package.resolved

      - name: Validate localizations
        run: |
          make localizations
          git diff --exit-code Sources/HuriCore/Resources

      - name: Lint and secret scan
        run: |
          make lint
          make security

      - name: Build Debug and Release
        run: |
          swift build
          swift build -c release

      - name: Test
        run: swift test --parallel

      - name: Package and verify
        run: |
          make package
          bash Scripts/verify-app.sh
          make dmg
          shasum -a 256 dist/Huri.dmg | tee dist/Huri.dmg.sha256

      - name: Upload local distribution proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Huri-${{ github.sha }}
          path: |
            dist/Huri.app
            dist/Huri.dmg
            dist/Huri.dmg.sha256
          if-no-files-found: error
          retention-days: 14
