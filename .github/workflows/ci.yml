name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package
        run: bash Scripts/package-app.sh
